<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Заметки{% endblock %} — Сервис заметок</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('notes.index') }}">📝 Сервис заметок</a>
    <div class="d-flex align-items-center gap-2 ms-auto">
      {% if g.user %}
        <span class="text-white">Вы вошли: <b>{{ g.user['username'] }}</b></span>
        <form method="post" action="{{ url_for('auth.logout') }}" class="m-0">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-outline-light btn-sm" type="submit">Выйти</button>
        </form>
      {% else %}
        <a class="btn btn-outline-light btn-sm" href="{{ url_for('auth.login') }}">Вход</a>
        <a class="btn btn-light btn-sm" href="{{ url_for('auth.register') }}">Регистрация</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container">
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
    </div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<footer class="text-center text-muted small my-4">Учебная практика ПМ.02 · Сервис заметок с авторизацией</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
